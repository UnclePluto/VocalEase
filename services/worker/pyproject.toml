[project]
name = "vocaease-worker"
version = "0.1.0"
description = "VocaEase asynchronous audio worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
]

[project.scripts]
vocaease-worker = "vocaease_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocaease_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "audio_processing: exercises the worker through its public queue",
]
