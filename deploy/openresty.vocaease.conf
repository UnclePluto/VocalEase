# 只匹配 VocaEase 的两个域名；保留独立证书及 HTTP-01 自动续期路径。
server {
    listen 80;
    server_name vocaease.whestsun.com vocaease-api.whestsun.com;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/vocaease-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name vocaease.whestsun.com vocaease-api.whestsun.com;
    ssl_certificate /etc/nginx/conf.d/vocaease-cert/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/conf.d/vocaease-cert/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vocaease_web http://vocaease-web:8080;
    client_max_body_size 12m;

    location /internal/ { return 404; }
    location ^~ /api/v1/media/local-upload/ {
        client_max_body_size 501m;
        proxy_request_buffering off;
        proxy_pass $vocaease_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass $vocaease_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
}
