map $http_x_request_id $vocaease_request_id {
    default $http_x_request_id;
    "" $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${WEB_MEDIA_ORIGIN}; font-src 'self' data:; connect-src 'self' ${WEB_MEDIA_ORIGIN}; media-src 'self' blob: ${WEB_MEDIA_ORIGIN}; worker-src 'self' blob:" always;
    add_header X-Request-ID $vocaease_request_id always;

    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $vocaease_request_id;
        proxy_read_timeout 60s;
        proxy_hide_header X-Request-ID;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
