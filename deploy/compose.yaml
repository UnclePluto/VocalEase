services:
  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "3000:8080"
    environment:
      WEB_MEDIA_ORIGIN: ${WEB_MEDIA_ORIGIN:-}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocaease}
      POSTGRES_USER: ${POSTGRES_USER:-vocaease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocaease}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-vocaease}
      POSTGRES_USER: ${POSTGRES_USER:-vocaease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocaease}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_BACKEND: ${MEDIA_BACKEND:-local}
      MEDIA_LOCAL_ROOT: /app/private-media
    command: uv run --no-sync python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - private_media:/app/private-media
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/live/')"]
      interval: 10s
      timeout: 3s
      retries: 5

  celery:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-vocaease}
      POSTGRES_USER: ${POSTGRES_USER:-vocaease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocaease}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_BACKEND: ${MEDIA_BACKEND:-local}
      MEDIA_LOCAL_ROOT: /app/private-media
    command: uv run --no-sync celery -A vocaease worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - private_media:/app/private-media

  celery-beat:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-vocaease}
      POSTGRES_USER: ${POSTGRES_USER:-vocaease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocaease}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_BACKEND: ${MEDIA_BACKEND:-local}
      MEDIA_LOCAL_ROOT: /app/private-media
    command: uv run --no-sync celery -A vocaease beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - private_media:/app/private-media

volumes:
  postgres_data:
  private_media:
