name: vocaease

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vocaease
      POSTGRES_USER: vocaease
      POSTGRES_PASSWORD: vocaease_dev
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocaease -d vocaease"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - database-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      VOCAEASE_DATABASE_URL: postgresql+psycopg://vocaease:vocaease_dev@database:5432/vocaease
      VOCAEASE_REDIS_URL: redis://redis:6379/0
      VOCAEASE_SEPARATION_REDIS_URL: redis://redis:6379/1
      VOCAEASE_MEDIA_DIRECTORY: /data/media
      VOCAEASE_WORKER_INTERNAL_TOKEN: development-worker-token
      VOCAEASE_PLAYBACK_MEDIA_SIGNING_SECRET: development-playback-signing-secret
      VOCAEASE_PLAYBACK_MEDIA_GRANT_SECONDS: "300"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - media-data:/data/media

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      VOCAEASE_REDIS_URL: redis://redis:6379/1
      VOCAEASE_MEDIA_DIRECTORY: /data/media
      VOCAEASE_API_BASE_URL: http://api:8000
      VOCAEASE_WORKER_INTERNAL_TOKEN: development-worker-token
      VOCAEASE_SEPARATION_MODEL_NAME: UVR-MDX-NET-Inst_HQ_3.onnx
      VOCAEASE_SEPARATION_MODEL_DIRECTORY: /data/separation-models
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - media-data:/data/media
      - separation-model-data:/data/separation-models

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  database-data:
  media-data:
  separation-model-data:
  redis-data:
